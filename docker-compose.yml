x-app: &app
  pull_policy: never
  build:
    dockerfile: containers/php/Dockerfile
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  restart: on-failure
  depends_on:
    - redis
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - .:/var/www/html

services:
  nginx:
    pull_policy: never
    build:
      dockerfile: containers/nginx/Dockerfile
    restart: on-failure
    ports:
      - "8080:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/var/www/html:ro
    environment:
      FPM_HOST: php
      FPM_PORT: 9000
  php:
    <<: *app
  scheduler:
    <<: *app
    user: root
    command: scheduler
    stop_signal: SIGKILL
    environment:
      PHP_HOST: php
      PHP_PORT: 9000
  worker:
    <<: *app
    user: root
    command: worker
    environment:
      PHP_HOST: php
      PHP_PORT: 9000
  redis:
    image: redis:8.10.3-alpine
    restart: on-failure
    ports:
      - "6379:6379"
  testing:
    profiles:
      - testing
    build:
      dockerfile: containers/php/Dockerfile
      context: .
      target: testing
      cache_to:
        - type=gha,mode=max,scope=testing
      cache_from:
        - type=gha,scope=testing

